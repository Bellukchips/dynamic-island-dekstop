[package]
name = "notch"
version = "1.1.6"
description = "A Tauri App"
authors = ["bellukstudio"]
edition = "2024"

[lib]
# The `_lib` suffix is needed to avoid name conflicts on Windows.
name = "notch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
toml = "0.8"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-drag = "2"   # BARU: drag file keluar dari notch (shelf) ke File Explorer / aplikasi lain
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", features = ["blocking", "json"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network", "disk"] }
arboard = { version = "3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
mpris = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.61"   # dibutuhkan makro #[implement] (callback sensor kamera)
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_Power",
  "Win32_System_WinRT",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Media_Audio",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_MediaFoundation",   # <-- BARU: IMFSensorActivityMonitor (indikator kamera)
  "Devices",
  "Devices_Radios",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
