<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catatan</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      --accent: 59, 130, 246;
      --bg: #0f0f11;
      --fg: #f0f0f2;
      --fg-rgb: 240, 240, 242;
      --surface: rgba(255, 255, 255, 0.06);
      --surface-hover: rgba(255, 255, 255, 0.1);
      --border: rgba(255, 255, 255, 0.10);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f5f7;
        --fg: #1a1a1e;
        --fg-rgb: 26, 26, 30;
        --surface: rgba(0, 0, 0, 0.06);
        --surface-hover: rgba(0, 0, 0, 0.10);
        --border: rgba(0, 0, 0, 0.10);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    /* ── Toolbar ── */
    .toolbar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .toolbar-title {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      opacity: 0.5;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .toolbar-meta {
      font-size: 11px;
      opacity: 0.35;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 30px;
      padding: 0 12px;
      border-radius: 8px;
      border: none;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn-ghost {
      background: var(--surface);
      color: var(--fg);
    }

    .btn-ghost:hover {
      background: var(--surface-hover);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: rgb(239, 68, 68);
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.28);
    }

    .btn-danger.confirm {
      background: rgb(239, 68, 68);
      color: #fff;
    }

    .btn-primary {
      background: rgba(var(--accent), 0.85);
      color: #fff;
    }

    .btn-primary:hover {
      background: rgba(var(--accent), 1);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .btn svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── Editor ── */
    .editor-wrap {
      flex: 1;
      min-height: 0;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
    }

    #note-editor {
      flex: 1;
      min-height: 0;
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--fg);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.65;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #note-editor:focus {
      border-color: rgba(var(--accent), 0.55);
    }

    #note-editor::placeholder {
      opacity: 0.35;
    }

    /* ── Status bar ── */
    .statusbar {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 20px;
      border-top: 1px solid var(--border);
      font-size: 11px;
    }

    .statusbar span {
      opacity: 0.4;
    }

    #dirty {
      opacity: 0;
      color: rgb(var(--accent));
      transition: opacity 0.15s;
    }

    #dirty.show {
      opacity: 0.9;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      padding: 6px 14px;
      border-radius: 8px;
      background: rgba(var(--fg-rgb), 0.12);
      backdrop-filter: blur(12px);
      font-size: 12px;
      font-weight: 600;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
  <script type="module" src="/src/note-detail.ts"></script>
</head>

<body>
  <div class="toolbar">
    <span class="toolbar-title">Catatan</span>
    <span class="toolbar-meta" id="meta-date"></span>
    <button class="btn btn-danger" id="btn-delete" title="Hapus catatan">
      <svg viewBox="0 0 24 24">
        <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" />
      </svg>
      <span id="btn-delete-label">Hapus</span>
    </button>
    <button class="btn btn-primary" id="btn-save" disabled title="Simpan (Ctrl+S)">
      <svg viewBox="0 0 24 24">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
        <polyline points="17 21 17 13 7 13 7 21" />
        <polyline points="7 3 7 8 15 8" />
      </svg>
      Simpan
    </button>
  </div>

  <div class="editor-wrap">
    <textarea id="note-editor" placeholder="Tulis catatan di sini…" spellcheck="true"></textarea>
  </div>

  <div class="statusbar">
    <span id="char-count">0 karakter</span>
    <span id="dirty">● Belum disimpan</span>
    <span id="line-count">0 baris</span>
  </div>

  <div id="toast"></div>

  <script type="module">
    const T = window.__TAURI__;
    const invoke = T?.core?.invoke;
    const emit = T?.event?.emit;
    const getCurrentWindow = T?.window?.getCurrentWindow;

    const $ = (id) => document.getElementById(id);
    const editor = $("note-editor");
    const btnSave = $("btn-save");
    const btnDelete = $("btn-delete");
    const btnDeleteLabel = $("btn-delete-label");
    const metaDate = $("meta-date");
    const charCount = $("char-count");
    const lineCount = $("line-count");
    const dirtyEl = $("dirty");
    const toast = $("toast");

    let noteId = "";
    let originalText = "";
    let toastTimer;
    let deleteTimer;
    let closeWarned = false;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2000);
    }

    const isDirty = () => editor.value.trim() !== originalText.trim();

    function updateStats() {
      const txt = editor.value;
      charCount.textContent = `${txt.length.toLocaleString("id")} karakter`;
      lineCount.textContent = `${txt ? txt.split("\n").length : 0} baris`;
      const canSave = isDirty() && txt.trim().length > 0;
      btnSave.disabled = !canSave;
      dirtyEl.classList.toggle("show", isDirty());
      if (!isDirty()) closeWarned = false;
    }

    async function loadMeta() {
      metaDate.textContent = "";
      if (!invoke || !noteId) return;
      try {
        const list = await invoke("notes_list");
        const n = list.find((x) => x.id === noteId);
        if (n?.updated_at) {
          metaDate.textContent = new Date(n.updated_at).toLocaleString("id-ID", {
            day: "numeric",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          });
        }
      } catch {
        /* tanggal opsional */
      }
    }

    // Dipanggil Rust (eval) setelah data catatan diisi ke window.__NOTE_*__
    function loadNoteDetail() {
      noteId = window.__NOTE_ID__ ?? "";
      originalText = window.__NOTE_TEXT__ ?? "";
      editor.value = originalText;
      closeWarned = false;
      updateStats();
      loadMeta();
    }
    window.loadNoteDetail = loadNoteDetail;

    // Init + antisipasi data yang disuntik Rust sedikit terlambat
    loadNoteDetail();
    let tries = 0;
    const retry = setInterval(() => {
      tries++;
      if (noteId || tries > 10) {
        clearInterval(retry);
        return;
      }
      if (window.__NOTE_ID__) {
        clearInterval(retry);
        loadNoteDetail();
      }
    }, 100);
    editor.focus();

    editor.addEventListener("input", updateStats);

    async function closeWindow() {
      try {
        if (getCurrentWindow) await getCurrentWindow().close();
        else window.close();
      } catch {
        try {
          await getCurrentWindow().destroy();
        } catch {
          window.close();
        }
      }
    }

    async function save() {
      const text = editor.value.trim();
      if (!text || btnSave.disabled) return;
      if (!invoke) {
        showToast("Tauri tidak tersedia");
        return;
      }
      try {
        await invoke("notes_update", {
          id: noteId,
          text
        });
        originalText = text;
        editor.value = text;
        updateStats();
        showToast("✓ Disimpan");
        emit?.("notes-changed"); // beritahu jendela utama untuk refresh
      } catch (e) {
        showToast("Gagal menyimpan");
        console.error(e);
      }
    }

    // Hapus dengan konfirmasi inline (confirm() bawaan tidak andal di webview Tauri)
    function resetDeleteButton() {
      btnDelete.classList.remove("confirm");
      btnDeleteLabel.textContent = "Hapus";
    }
    async function deleteNote() {
      if (!btnDelete.classList.contains("confirm")) {
        btnDelete.classList.add("confirm");
        btnDeleteLabel.textContent = "Yakin?";
        clearTimeout(deleteTimer);
        deleteTimer = setTimeout(resetDeleteButton, 3000);
        return;
      }
      clearTimeout(deleteTimer);
      if (!invoke) {
        showToast("Tauri tidak tersedia");
        return;
      }
      try {
        await invoke("notes_remove", {
          id: noteId
        });
        emit?.("notes-changed");
        await closeWindow();
      } catch (e) {
        resetDeleteButton();
        showToast("Gagal menghapus");
        console.error(e);
      }
    }

    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
        e.preventDefault();
        save();
      } else if (e.key === "Escape") {
        if (isDirty() && !closeWarned) {
          closeWarned = true;
          showToast("Belum disimpan — tekan Esc lagi untuk tutup");
        } else {
          closeWindow();
        }
      }
    });

    btnSave.addEventListener("click", save);
    btnDelete.addEventListener("click", deleteNote);
  </script>
</body>

</html>
